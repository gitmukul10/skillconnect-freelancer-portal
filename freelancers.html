<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Browse, search, and manage talented freelancers on SkillConnect."
    >

    <title>Find Freelancers | SkillConnect</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="site-header">

        <div class="container navbar">

            <a href="index.html" class="logo" aria-label="SkillConnect Home">
                Skill<span>Connect</span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="freelancers.html" class="active">Find Freelancers</a>
                <a href="bookings.html">Bookings</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>

            <div class="nav-actions">
                <button
                    type="button"
                    id="logoutButton"
                    class="btn btn-secondary"
                >
                    Logout
                </button>
            </div>

        </div>

    </header>


    <main class="freelancers-page">

        <!-- Page Hero -->
        <section class="catalog-hero">

            <div class="container">

                <p class="eyebrow">
                    FIND TALENT
                </p>

                <h1>
                    Find the perfect freelancer for your project.
                </h1>

                <p>
                    Browse skilled professionals, explore their expertise,
                    and connect with the right person for your next project.
                </p>

            </div>

        </section>


        <!-- Catalog -->
        <section class="catalog-section">

            <div class="container">

                <!-- Search and Controls -->
                <div class="catalog-toolbar">

                    <div class="search-box">

                        <label
                            for="freelancerSearch"
                            class="visually-hidden"
                        >
                            Search freelancers
                        </label>

                        <input
                            type="search"
                            id="freelancerSearch"
                            placeholder="Search by name or skill..."
                        >

                    </div>


                    <select
                        id="categoryFilter"
                        aria-label="Filter freelancers by category"
                    >
                        <option value="all">
                            All Categories
                        </option>
                    </select>


                    <button
                        type="button"
                        id="addFreelancerButton"
                        class="btn btn-primary"
                    >
                        + Add Freelancer
                    </button>

                </div>


                <!-- Results Info -->
                <p
                    id="resultsInfo"
                    class="results-info"
                    aria-live="polite"
                >
                    Loading freelancers...
                </p>


                <!-- Freelancer Cards -->
                <div
                    id="freelancerGrid"
                    class="freelancer-grid"
                >
                    <!-- Dynamic cards -->
                </div>

            </div>

        </section>

    </main>


    <!-- Freelancer Modal -->
    <div
        id="freelancerModal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-backdrop"
            data-close-modal
        ></div>


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Freelancer
                </h2>

                <button
                    type="button"
                    id="closeModalButton"
                    class="modal-close"
                    aria-label="Close dialog"
                >
                    ×
                </button>

            </div>


            <form id="freelancerForm" novalidate>

                <input
                    type="hidden"
                    id="freelancerId"
                >


                <div class="form-group">

                    <label for="freelancerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="freelancerName"
                        required
                        placeholder="Enter freelancer name"
                    >

                </div>


                <div class="form-group">

                    <label for="freelancerCategory">
                        Category
                    </label>

                    <select
                        id="freelancerCategory"
                        required
                    >
                        <option value="">
                            Select category
                        </option>

                        <option value="Web Development">
                            Web Development
                        </option>

                        <option value="UI/UX Design">
                            UI/UX Design
                        </option>

                        <option value="Mobile Development">
                            Mobile Development
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Digital Marketing">
                            Digital Marketing
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="freelancerSkills">
                        Skills
                    </label>

                    <input
                        type="text"
                        id="freelancerSkills"
                        required
                        placeholder="Example: React, JavaScript, Node.js"
                    >

                </div>


                <div class="form-group">

                    <label for="freelancerRate">
                        Hourly Rate ($)
                    </label>

                    <input
                        type="number"
                        id="freelancerRate"
                        required
                        min="1"
                        placeholder="Example: 25"
                    >

                </div>


                <div class="form-group">

                    <label for="freelancerRating">
                        Rating
                    </label>

                    <input
                        type="number"
                        id="freelancerRating"
                        required
                        min="1"
                        max="5"
                        step="0.1"
                        placeholder="Example: 4.8"
                    >

                </div>


                <p
                    id="freelancerMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelModalButton"
                        class="btn btn-outline"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Freelancer
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/freelancers.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
